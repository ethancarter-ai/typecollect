[project]
name = "typecollect"
version = "0.1.0"
description = "Collect and report Python type annotations across a codebase."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/ethancarter-ai/typecollect"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
typecollect = "typecollect:main"

[tool.setuptools]
py-modules = ["typecollect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
